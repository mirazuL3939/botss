<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ModerBot — Панель</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo"><span class="logo-mark">◈</span> ModerBot</div>
        <div id="serverLine" class="server-line">—</div>
      </div>
      <nav class="nav-tabs">
        <button id="btnViewMain" type="button" class="active">Панель</button>
        <button id="btnViewGames" type="button">Игры</button>
      </nav>
      <div class="topbar-right">
        <span id="clock" class="clock">--:--:--</span>
        <span id="socketState" class="conn-pill">connecting</span>
      </div>
    </header>

    <main class="layout" id="viewMain">
      <section class="controls">
        <div class="card">
          <div class="card-head">
            <h2>IP сервера</h2>
            <span id="ipState" class="badge ok">saved</span>
          </div>
          <input id="hostInput" placeholder="eu.cheatmine.net" spellcheck="false" autocomplete="off" />
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Сообщение в Telegram</h2>
            <span id="tgState" class="badge ok">saved</span>
          </div>
          <textarea id="tgTemplate" rows="7" spellcheck="false"></textarea>
          <div class="hint">{emoji} {date} {time} {mode} {player} {rule} {desc} {message} {punishment}</div>
        </div>
      </section>

      <section class="card chat-send-card">
        <div class="chat-send-row">
          <select id="chatBotSelect" class="chat-bot-select"></select>
          <button id="botToggleBtn" type="button" class="ghost-btn">⏹ Стоп</button>
          <button id="botRestartBtn" type="button" class="ghost-btn">↺ Рестарт</button>
          <div class="chat-send-divider"></div>
          <input id="chatSendInput" class="chat-send-input" placeholder="Сообщение или команда для бота..." autocomplete="off" spellcheck="false" />
          <button id="chatSendBtn" type="button" class="ghost-btn">Отправить</button>
        </div>
      </section>

      <section class="card logs-card">
        <div class="logs-toolbar">
          <div class="log-filter-block">
            <div class="log-filter-row">
              <span class="filter-label">Источники</span>
              <div id="logTabs" class="log-tabs"></div>
            </div>
            <div class="log-filter-row">
              <span class="filter-label">Игроки</span>
              <div class="player-filter">
                <div id="playerFilterChips" class="player-filter-chips"></div>
                <div class="player-filter-add">
                  <input id="playerFilterInput" placeholder="Ник игрока" autocomplete="off" spellcheck="false" />
                  <button id="addPlayerFilter" type="button">+</button>
                  <button id="clearPlayerFilters" type="button">Все</button>
                </div>
              </div>
            </div>
          </div>
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input id="logSearch" placeholder="Поиск по слову, нику, дате или времени…" autocomplete="off" />
          </div>
          <div class="logs-actions">
            <label class="log-date-control">
              <span>Дата</span>
              <input id="logDate" type="date" aria-label="Дата логов" />
            </label>
            <button id="downloadDayLog" type="button" class="ghost-btn" title="Скачать логи за выбранный день">↓ Скачать</button>
            <span id="logCount" class="badge">0</span>
          </div>
        </div>
        <div id="logs" class="logs"></div>
      </section>
    </main>

    <section class="games-view" id="viewGames" hidden>
      <div class="card games-card">
        <div class="games-toolbar">
          <div id="gameTabs" class="log-tabs">
            <button data-game="snake" type="button" class="active">🐍 Змейка</button>
            <button data-game="mines" type="button">💣 Сапёр</button>
            <button data-game="dino" type="button">🦖 Динозаврик</button>
          </div>
          <span id="gameInfo" class="badge">—</span>
          <button id="gameRestart" type="button" class="ghost-btn">↻ заново</button>
        </div>
        <div id="gameStage" class="game-stage"></div>
        <div id="gameHint" class="hint game-hint"></div>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/games.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
